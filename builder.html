<div style="background: #000; color: #00ff88; padding: 20px; font-family: monospace;">
    <h3>[ GERADOR DE APK - ZEUS MOB ]</h3>
    <input type="text" placeholder="Nome do Cliente" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0;">
    <input type="text" placeholder="Nome do App" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0;">
    <input type="text" placeholder="Link de Download" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0;">

    <div style="margin: 15px 0;">
        <p>PERMISSÕES:</p>
        <label><input type="checkbox" checked> Acessibilidade</label><br>
        <label><input type="checkbox" checked> Câmera</label><br>
        <label><input type="checkbox" checked> Arquivos</label><br>
        <label><input type="checkbox" checked> Contatos</label>
    </div>

    <button style="background:#00ff88; color:#000; padding:10px; border:none; width:100%; font-weight:bold;">
        GERAR INSTÂNCIA
    </button>
</div>
<input type="text" placeholder="Título da Notificação" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0;">
<textarea placeholder="Mensagem da Notificação" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0; height:50px;"></textarea>
<input type="text" placeholder="Versão do App (ex: 1.0.4)" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0;">
<input type="text" placeholder="ID do App (ex: com.zeus.mob)" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0;">
<div style="background: #000; color: #00ff88; padding: 20px; font-family: monospace; border: 1px solid #111;">
    <h3 style="border-bottom: 1px solid #00ff88; padding-bottom: 10px; text-align: center;">[ ⚒️ GERADOR DE APK - ZEUS MOB ]</h3>

    <!-- Campos que você já tinha -->
    <input type="text" id="clientName" placeholder="Nome do Cliente" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0; padding: 8px;">
    <input type="text" id="appName" placeholder="Nome do App" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0; padding: 8px;">
    <input type="text" id="appLink" placeholder="Link de Download" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0; padding: 8px;">

    <!-- Novos Campos de Notificação -->
    <input type="text" id="notifTitle" placeholder="Título da Notificação" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0; padding: 8px;">
    <textarea id="notifMsg" placeholder="Mensagem da Notificação" style="width:100%; background:#111; border:1px solid #00ff88; color:#fff; margin:5px 0; padding: 8px; height: 50px;"></textarea>

    <!-- Versão e ID Alteráveis -->
    <div style="display: flex; gap: 10px; margin: 5px 0;">
        <input type="text" id="appVersion" placeholder="Versão (Ex: 1.0.4)" style="flex: 1; background:#111; border:1px solid #00ff88; color:#fff; padding: 8px;">
        <input type="text" id="appId" placeholder="ID (Ex: com.zeus.mob)" style="flex: 1; background:#111; border:1px solid #00ff88; color:#fff; padding: 8px;">
    </div>

    <div style="margin: 15px 0;">
        <p style="font-size: 12px; color: #888;">PERMISSÕES:</p>
        <label><input type="checkbox" checked> Acessibilidade</label><br>
        <label><input type="checkbox" checked> Câmera</label><br>
        <label><input type="checkbox" checked> Arquivos</label><br>
        <label><input type="checkbox" checked> Contatos</label>
    </div>

    <!-- Área de Ícone -->
    <div style="border: 1px dashed #00ff88; padding: 15px; text-align: center; margin-bottom: 15px; cursor: pointer;">
        UPLOAD ÍCONE (.PNG)
    </div>

    <div style="display: flex; gap: 10px;">
        <button style="flex: 1; background: #111; color: #fff; border: 1px solid #333; padding: 10px;">BACK</button>
        <button onclick="gerarApk()" style="flex: 2; background:#00ff88; color:#000; padding:10px; border:none; font-weight:bold; cursor: pointer;">
            GERAR INSTÂNCIA
        </button>
    </div>
</div>

<script>
function gerarApk() {
    const dados = {
        cliente: document.getElementById('clientName').value,
        app: document.getElementById('appName').value,
        id: document.getElementById('appId').value,
        versao: document.getElementById('appVersion').value
    };
    alert("Iniciando build do APK para: " + dados.cliente);
    console.log("Dados do Build:", dados);
}
</script>
