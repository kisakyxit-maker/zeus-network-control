<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00ff88" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZEUS MOB" />
    <meta name="application-name" content="ZEUS MOB" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="ZEUS MOB dashboard" />
    <meta name="apple-touch-startup-image" content="./splash.png" />
    <title>ZEUS MOB</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #000;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: #000 url('./splash.png') center center / contain no-repeat;
        z-index: 9999;
        pointer-events: none;
        animation: fadeSplash 1.2s ease 1.6s forwards;
      }
      @keyframes fadeSplash {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
