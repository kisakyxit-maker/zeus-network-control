rootProject.name = 'ZeusMob'
rootProject.projectDir = rootDir

// Safely import native modules gradle script
def nativeModulesGradleScript = null
try {
  nativeModulesGradleScript = new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/native_modules.gradle', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim())
} catch (Exception e) {
  println("Warning: Could not load native_modules.gradle: " + e.message)
}

if (nativeModulesGradleScript && nativeModulesGradleScript.exists()) {
  apply from: nativeModulesGradleScript
}

apply from: file("../node_modules/@expo/android/expo.gradle")
apply from: file("../node_modules/react-native-gradle-plugin/react.gradle")

include ':app'
